<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabets Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #0f1b2d;
            --bg-2: #152844;
            --ink: #ebf3ff;
            --muted: #a8b7ce;
            --panel: rgba(10, 20, 35, 0.75);
            --stroke: rgba(182, 210, 248, 0.24);
            --ok: #5de4a8;
            --warn: #f6bf69;
            --danger: #ff7a7a;
            --teal: #1ab4a1;
            --blue: #3478f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "Bricolage Grotesque", sans-serif;
            background:
                radial-gradient(1100px 520px at 82% -14%, rgba(75, 198, 255, 0.28), transparent 58%),
                radial-gradient(920px 410px at -12% 0%, rgba(26, 180, 161, 0.2), transparent 62%),
                linear-gradient(155deg, var(--bg), var(--bg-2));
            padding: 20px;
        }

        .top-nav {
            width: min(760px, 100%);
            margin: 0 auto 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .top-link {
            border: 1px solid var(--stroke);
            color: #d4e7ff;
            text-decoration: none;
            border-radius: 999px;
            padding: 7px 11px;
            font: 700 12px/1 "Space Mono", monospace;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(8, 15, 28, 0.5);
        }

        .shell {
            width: min(760px, 100%);
            margin: 0 auto;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(4, 10, 20, 0.35);
            backdrop-filter: blur(7px);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--stroke);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.35rem, 2.7vw, 1.9rem);
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        .section {
            padding: 18px 20px;
            border-bottom: 1px solid var(--stroke);
        }

        .section:last-child { border-bottom: 0; }

        .section h2 {
            margin: 0 0 8px;
            font-size: 1rem;
        }

        .social-grid {
            display: grid;
            gap: 10px;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            color: #eff7ff;
            cursor: pointer;
            font: 700 0.82rem/1 "Space Mono", monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-twitter { background: #1d9bf0; }
        .btn-primary {
            background: linear-gradient(135deg, var(--teal), var(--blue));
            box-shadow: 0 8px 18px rgba(29, 138, 223, 0.27);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(179, 207, 244, 0.35);
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        label {
            display: block;
            margin: 10px 0 6px;
            color: #c6d7ee;
            font-size: 0.92rem;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid rgba(197, 220, 251, 0.24);
            background: rgba(7, 13, 26, 0.76);
            color: var(--ink);
            font: 500 0.94rem/1 "Space Mono", monospace;
            outline: none;
        }

        .status {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(184, 208, 241, 0.2);
            background: rgba(7, 14, 26, 0.74);
            min-height: 44px;
            color: #d2e4fd;
            font-family: "Space Mono", monospace;
            font-size: 0.84rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status.ok { border-color: rgba(93, 228, 168, 0.5); }
        .status.warn { border-color: rgba(246, 191, 105, 0.5); }
        .status.danger { border-color: rgba(255, 122, 122, 0.55); }

        .hidden { display: none; }

        details {
            border: 1px solid var(--stroke);
            border-radius: 10px;
            padding: 10px;
            background: rgba(7, 13, 26, 0.45);
        }

        summary {
            cursor: pointer;
            font: 700 0.83rem/1 "Space Mono", monospace;
            letter-spacing: 0.04em;
        }

        .qr {
            width: 140px;
            height: 140px;
            border-radius: 10px;
            border: 1px solid var(--stroke);
            background: #fff;
            margin-top: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a class="top-link" href="./index.html">Sign In</a>
        <a class="top-link" href="./email-auth.html">Sign Up</a>
        <a class="top-link" href="./password-reset.html">Forgot Password</a>
        <a class="top-link" href="./dashboard.html">Dashboard</a>
    </nav>

    <main class="shell">
        <section class="card">
            <div class="header">
                <h1>Sign In</h1>
                <p>Continue with Google, Twitter, or Telegram. If account has 2FA, you will be prompted automatically.</p>
            </div>

            <div class="section">
                <h2>Continue with</h2>
                <div class="social-grid">
                    <div id="g_id_onload" data-context="signin" data-ux_mode="popup" data-callback="handleGoogleResponse" data-auto_prompt="false"></div>
                    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-shape="pill"></div>
                    <button class="btn btn-twitter" id="twitterLoginBtn">Continue with Twitter</button>
                    <div id="telegramWidgetWrap"></div>
                </div>
            </div>

            <div class="section">
                <h2>Account Status</h2>
                <div id="status" class="status">Waiting for sign-in...</div>
            </div>

            <div class="section hidden" id="twoFaLoginPanel">
                <h2>Enter 2FA Code</h2>
                <label for="twoFaCode">Authenticator Code</label>
                <input id="twoFaCode" placeholder="6-digit code" maxlength="6" />
                <div class="row" style="margin-top: 10px;">
                    <button class="btn btn-primary" id="twoFaLoginBtn">Verify 2FA</button>
                </div>
            </div>

            <div class="section hidden" id="twoFaSetupPanel">
                <h2>Setup 2FA (Optional)</h2>
                <div class="row">
                    <button class="btn btn-outline" id="setupStartBtn">Setup Now</button>
                    <button class="btn btn-primary" id="goDashboardBtn">Skip for Now</button>
                </div>

                <div id="setupBox" class="hidden" style="margin-top: 10px;">
                    <div id="setupSecretText" class="status"></div>
                    <img id="setupQr" class="qr hidden" alt="2FA QR Code" />
                    <label for="setupCode">Authenticator Code</label>
                    <input id="setupCode" placeholder="6-digit code" maxlength="6" />
                    <div class="row" style="margin-top: 10px;">
                        <button class="btn btn-primary" id="setupVerifyBtn">Enable 2FA</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <details>
                    <summary>Advanced Settings</summary>
                    <label for="apiBase">API Base URL</label>
                    <input id="apiBase" value="https://anthropometrical-unrepined-elvie.ngrok-free.dev/api/v1" />

                    <label for="googleClientId">Google Client ID</label>
                    <input id="googleClientId" value="997497031497-n79hhte5cb9au9o6eeovkpjlpkm00qom.apps.googleusercontent.com" />

                    <label for="twitterClientId">Twitter Client ID</label>
                    <input id="twitterClientId" value="ZUZQb05IY0FISk5DSU8zdHk1TEc6MTpjaQ" />

                    <label for="twitterRedirectUri">Twitter Redirect URI</label>
                    <input id="twitterRedirectUri" value="https://mock-frontend-one.vercel.app/" />

                    <label for="telegramBotUsername">Telegram Bot Username</label>
                    <input id="telegramBotUsername" value="Krabet_bot" />
                </details>
            </div>
        </section>
    </main>

    <script>
        let authToken = null;
        let currentUser = null;
        let pending2FaUserId = null;
        let pendingProvider = null;
        let pendingNeedsEmail = false;
        let profileHints = {};

        const statusEl = document.getElementById('status');
        const twoFaLoginPanel = document.getElementById('twoFaLoginPanel');
        const twoFaSetupPanel = document.getElementById('twoFaSetupPanel');
        const setupBox = document.getElementById('setupBox');
        const setupSecretText = document.getElementById('setupSecretText');
        const setupQr = document.getElementById('setupQr');

        const apiBaseEl = document.getElementById('apiBase');
        const googleClientIdEl = document.getElementById('googleClientId');
        const twitterClientIdEl = document.getElementById('twitterClientId');
        const twitterRedirectUriEl = document.getElementById('twitterRedirectUri');
        const telegramBotUsernameEl = document.getElementById('telegramBotUsername');

        function apiBase() {
            return apiBaseEl.value.trim().replace(/\/$/, '');
        }

        function setStatus(message, type = '') {
            statusEl.className = `status ${type}`.trim();
            statusEl.textContent = message;
        }

        function b64ToObj(token) {
            try {
                const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                const decoded = atob(base64);
                return JSON.parse(decoded);
            } catch {
                return {};
            }
        }

        function storeSessionAndRedirect(nextPage = './dashboard.html') {
            if (!authToken || !currentUser) {
                setStatus('No active token/user to continue.', 'danger');
                return;
            }
            const profile = {
                provider: pendingProvider,
                username: currentUser.username,
                id: currentUser.id,
                email: currentUser.email || profileHints.email || null,
                avatarUrl: currentUser.avatarUrl || profileHints.avatarUrl || null,
                jwtPayload: b64ToObj(authToken),
            };
            localStorage.setItem('krabets_session', JSON.stringify({ token: authToken, user: profile }));
            window.location.href = nextPage;
        }

        async function fetch2FAStatus(token) {
            const res = await fetch(`${apiBase()}/2fa/status`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (!res.ok) return { enabled: false };
            return res.json();
        }

        function randomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            let result = '';
            for (let i = 0; i < length; i += 1) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        async function sha256Base64Url(input) {
            const bytes = new TextEncoder().encode(input);
            const digest = await crypto.subtle.digest('SHA-256', bytes);
            return btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        async function processOAuthResult(provider, res) {
            const data = await res.json();
            if (!res.ok) {
                setStatus(`${provider} login failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            pendingProvider = provider;
            if (data.requires2FA) {
                pending2FaUserId = data.userId;
                pendingNeedsEmail = !!data.needsEmail;
                twoFaLoginPanel.classList.remove('hidden');
                twoFaSetupPanel.classList.add('hidden');
                setStatus('2FA required. Enter your authenticator code.', 'warn');
                return;
            }

            authToken = data.token;
            currentUser = data.user;
            pending2FaUserId = null;
            pendingNeedsEmail = !!data.needsEmail || !data.user?.email;
            twoFaLoginPanel.classList.add('hidden');
            twoFaSetupPanel.classList.remove('hidden');

            if (pendingNeedsEmail) {
                setStatus('Email missing for this OAuth account. Redirecting to email completion...', 'warn');
                storeSessionAndRedirect('./oauth-complete-email.html');
                return;
            }

            const status = await fetch2FAStatus(authToken);
            if (status.enabled) {
                setStatus('Login successful. Redirecting to dashboard...', 'ok');
                storeSessionAndRedirect();
                return;
            }

            setStatus('Login successful. You can setup 2FA now or skip.', 'ok');
        }

        async function handleGoogleResponse(response) {
            const idToken = response.credential;
            if (!idToken) {
                setStatus('Google did not return idToken.', 'danger');
                return;
            }

            const decoded = b64ToObj(idToken);
            profileHints = { email: decoded.email || null, avatarUrl: decoded.picture || null };

            setStatus('Verifying Google sign-in...', 'warn');
            const res = await fetch(`${apiBase()}/auth/oauth/google`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken }),
            });
            await processOAuthResult('google', res);
        }
        window.handleGoogleResponse = handleGoogleResponse;

        async function onTelegramAuth(user) {
            profileHints = { email: null, avatarUrl: user.photo_url || null };
            setStatus('Verifying Telegram sign-in...', 'warn');
            const res = await fetch(`${apiBase()}/auth/oauth/telegram`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user),
            });
            await processOAuthResult('telegram', res);
        }
        window.onTelegramAuth = onTelegramAuth;

        function renderTelegramWidget() {
            const wrap = document.getElementById('telegramWidgetWrap');
            const bot = telegramBotUsernameEl.value.trim();
            if (!bot) {
                wrap.innerHTML = '<div class="status warn">Add Telegram bot username in Advanced Settings.</div>';
                return;
            }

            wrap.innerHTML = '';
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://telegram.org/js/telegram-widget.js?22';
            script.setAttribute('data-telegram-login', bot);
            script.setAttribute('data-size', 'large');
            script.setAttribute('data-onauth', 'onTelegramAuth(user)');
            script.setAttribute('data-request-access', 'write');
            wrap.appendChild(script);
        }

        document.getElementById('twitterLoginBtn').addEventListener('click', async () => {
            const clientId = twitterClientIdEl.value.trim();
            const redirectUri = twitterRedirectUriEl.value.trim();
            if (!clientId || !redirectUri) {
                setStatus('Twitter client id and redirect uri are required.', 'danger');
                return;
            }

            const verifier = randomString(128);
            const challenge = await sha256Base64Url(verifier);
            localStorage.setItem('krabets_tw_verifier', verifier);
            localStorage.setItem('krabets_tw_redirect', redirectUri);
            setStatus('Redirecting to Twitter...', 'warn');

            const url =
                `https://twitter.com/i/oauth2/authorize?response_type=code` +
                `&client_id=${encodeURIComponent(clientId)}` +
                `&redirect_uri=${encodeURIComponent(redirectUri)}` +
                `&scope=${encodeURIComponent('users.read tweet.read')}` +
                `&state=krabets-debug` +
                `&code_challenge=${encodeURIComponent(challenge)}` +
                `&code_challenge_method=S256`;

            window.location.href = url;
        });

        document.getElementById('twoFaLoginBtn').addEventListener('click', async () => {
            const code = document.getElementById('twoFaCode').value.trim();
            if (!pending2FaUserId || !code) {
                setStatus('2FA userId/code missing.', 'danger');
                return;
            }

            setStatus('Verifying 2FA...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: pending2FaUserId, code }),
            });
            const data = await res.json();
            if (!res.ok) {
                setStatus(`2FA login failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            authToken = data.token;
            currentUser = data.user;
            twoFaLoginPanel.classList.add('hidden');
            twoFaSetupPanel.classList.remove('hidden');

            if (pendingNeedsEmail || !data.user?.email) {
                setStatus('Email missing. Redirecting to complete email step...', 'warn');
                storeSessionAndRedirect('./oauth-complete-email.html');
                return;
            }

            const status = await fetch2FAStatus(authToken);
            if (status.enabled) {
                setStatus('2FA login complete. Redirecting...', 'ok');
                storeSessionAndRedirect();
                return;
            }

            setStatus('Login complete. You can setup 2FA now or skip.', 'ok');
        });

        document.getElementById('setupStartBtn').addEventListener('click', async () => {
            if (!authToken) {
                setStatus('Sign in first.', 'danger');
                return;
            }

            setStatus('Creating 2FA setup...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/setup`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${authToken}` },
            });
            const data = await res.json();
            if (!res.ok) {
                setStatus(`2FA setup failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setupBox.classList.remove('hidden');
            setupSecretText.textContent = `Secret: ${data.secret}`;
            if (data.qrCodeUrl) {
                setupQr.src = data.qrCodeUrl;
                setupQr.classList.remove('hidden');
            }
            setStatus('Scan and enter current authenticator code.', 'ok');
        });

        document.getElementById('setupVerifyBtn').addEventListener('click', async () => {
            const code = document.getElementById('setupCode').value.trim();
            if (!authToken || !code) {
                setStatus('Need setup code.', 'danger');
                return;
            }

            setStatus('Enabling 2FA...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/verify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${authToken}`,
                },
                body: JSON.stringify({ code }),
            });
            const data = await res.json();
            if (!res.ok) {
                setStatus(`2FA verify failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setStatus('2FA enabled. Redirecting to dashboard...', 'ok');
            storeSessionAndRedirect();
        });

        document.getElementById('goDashboardBtn').addEventListener('click', () => {
            setStatus('Redirecting to dashboard...', 'ok');
            storeSessionAndRedirect();
        });

        async function handleTwitterCallbackIfPresent() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (!code) return;

            const codeVerifier = localStorage.getItem('krabets_tw_verifier');
            const redirectUri = localStorage.getItem('krabets_tw_redirect') || twitterRedirectUriEl.value.trim();
            if (!codeVerifier) {
                setStatus('Twitter callback found but code verifier is missing.', 'danger');
                return;
            }

            setStatus('Completing Twitter login...', 'warn');
            const res = await fetch(`${apiBase()}/auth/oauth/twitter`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, codeVerifier, redirectUri }),
            });
            await processOAuthResult('twitter', res);
            window.history.replaceState({}, '', `${window.location.origin}${window.location.pathname}`);
        }

        function initGoogleClient() {
            const clientId = googleClientIdEl.value.trim();
            if (!clientId) {
                setStatus('Provide Google Client ID in Advanced Settings.', 'warn');
                return;
            }
            const g = document.getElementById('g_id_onload');
            g.setAttribute('data-client_id', clientId);
        }

        googleClientIdEl.addEventListener('change', initGoogleClient);
        telegramBotUsernameEl.addEventListener('change', renderTelegramWidget);

        initGoogleClient();
        renderTelegramWidget();
        handleTwitterCallbackIfPresent();
    </script>
</body>
</html>
