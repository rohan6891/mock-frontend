<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabets Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #131e31;
            --bg-2: #233048;
            --panel: rgba(11, 22, 40, 0.78);
            --ink: #eaf2ff;
            --muted: #a0b5d2;
            --stroke: rgba(184, 210, 245, 0.2);
            --ok: #66e1aa;
            --warn: #f4bf63;
            --danger: #ff8e8e;
            --teal: #2cccb2;
            --blue: #3376f5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "Bricolage Grotesque", sans-serif;
            background:
                radial-gradient(1000px 500px at 90% -20%, rgba(86, 200, 255, 0.26), transparent 60%),
                radial-gradient(800px 400px at -20% 0%, rgba(44, 204, 178, 0.18), transparent 63%),
                linear-gradient(160deg, var(--bg), var(--bg-2));
            padding: 20px;
        }

        .top-nav {
            width: min(760px, 100%);
            margin: 0 auto 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .top-link {
            border: 1px solid var(--stroke);
            color: #d4e7ff;
            text-decoration: none;
            border-radius: 999px;
            padding: 7px 11px;
            font: 700 12px/1 "Space Mono", monospace;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(8, 15, 28, 0.5);
        }

        .shell { width: min(760px, 100%); margin: 0 auto; }

        .card {
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(4, 10, 20, 0.35);
            backdrop-filter: blur(8px);
        }

        .header, .section {
            padding: 18px 20px;
            border-bottom: 1px solid var(--stroke);
        }

        .section:last-child { border-bottom: 0; }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.35rem, 2.7vw, 1.9rem);
        }

        p { margin: 0; color: var(--muted); }

        label {
            display: block;
            margin: 10px 0 6px;
            color: #c7d8f1;
            font-size: 0.92rem;
        }

        input {
            width: 100%;
            border: 1px solid rgba(196, 219, 250, 0.24);
            border-radius: 10px;
            background: rgba(8, 14, 26, 0.78);
            color: var(--ink);
            padding: 11px 12px;
            font: 500 0.94rem/1 "Space Mono", monospace;
            outline: none;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            color: #eff7ff;
            font: 700 0.82rem/1 "Space Mono", monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-main { background: linear-gradient(135deg, var(--teal), var(--blue)); }
        .btn-alt { background: #2d4a79; }

        .status {
            margin-top: 10px;
            min-height: 48px;
            border: 1px solid rgba(189, 211, 243, 0.2);
            border-radius: 10px;
            padding: 10px 11px;
            font: 0.84rem/1.45 "Space Mono", monospace;
            color: #d7e6fb;
            background: rgba(8, 14, 24, 0.72);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ok { border-color: rgba(102, 225, 170, 0.55); }
        .warn { border-color: rgba(244, 191, 99, 0.56); }
        .danger { border-color: rgba(255, 142, 142, 0.62); }

        details {
            border: 1px solid var(--stroke);
            border-radius: 10px;
            padding: 10px;
            background: rgba(7, 13, 26, 0.45);
        }

        summary {
            cursor: pointer;
            font: 700 0.83rem/1 "Space Mono", monospace;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a class="top-link" href="./index.html">Sign In</a>
        <a class="top-link" href="./email-auth.html">Sign Up</a>
        <a class="top-link" href="./password-reset.html">Forgot Password</a>
        <a class="top-link" href="./dashboard.html">Dashboard</a>
    </nav>

    <main class="shell">
        <section class="card">
            <div class="header">
                <h1>Forgot Password</h1>
                <p>Request a reset code, set a new password, and verify sign-in.</p>
            </div>

            <div class="section">
                <label for="email">Email</label>
                <input id="email" placeholder="user@example.com" />
                <div class="row">
                    <button class="btn btn-main" id="forgotBtn">Send Reset Code</button>
                </div>
            </div>

            <div class="section">
                <label for="code">Reset Code</label>
                <input id="code" maxlength="6" placeholder="6-digit code" />
                <label for="newPassword">New Password</label>
                <input id="newPassword" type="password" placeholder="NewPass@123" />
                <div class="row">
                    <button class="btn btn-main" id="resetBtn">Update Password</button>
                    <button class="btn btn-alt" id="verifyLoginBtn">Verify Sign In</button>
                </div>
                <div id="details" class="status">Login verification output appears here.</div>
            </div>

            <div class="section">
                <h2 style="margin: 0 0 8px; font-size: 1rem;">Status</h2>
                <div id="status" class="status">Ready.</div>
            </div>

            <div class="section">
                <details>
                    <summary>Advanced Settings</summary>
                    <label for="apiBase">API Base URL</label>
                    <input id="apiBase" value="https://anthropometrical-unrepined-elvie.ngrok-free.dev/api/v1" />
                </details>
            </div>
        </section>
    </main>

    <script>
        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');
        const apiBaseEl = document.getElementById('apiBase');

        function apiBase() {
            return apiBaseEl.value.trim().replace(/\/$/, '');
        }

        function setStatus(msg, type) {
            statusEl.className = `status ${type || ''}`.trim();
            statusEl.textContent = msg;
        }

        function setDetails(msg, type) {
            detailsEl.className = `status ${type || ''}`.trim();
            detailsEl.textContent = msg;
        }

        document.getElementById('forgotBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            setStatus('Requesting reset code...', 'warn');

            const res = await fetch(`${apiBase()}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`Request failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setStatus('Reset code sent. Check your email.', 'ok');
        });

        document.getElementById('resetBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('code').value.trim();
            const newPassword = document.getElementById('newPassword').value;

            setStatus('Updating password...', 'warn');
            const res = await fetch(`${apiBase()}/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, newPassword }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`Reset failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setStatus('Password updated successfully.', 'ok');
        });

        document.getElementById('verifyLoginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const newPassword = document.getElementById('newPassword').value;

            setStatus('Verifying sign-in with new password...', 'warn');
            const res = await fetch(`${apiBase()}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: newPassword }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`Sign-in check failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            if (data.requires2FA) {
                setStatus('Password works. Account requires 2FA.', 'ok');
                setDetails(`requires2FA=true\nuserId=${data.userId}`);
                return;
            }

            setStatus('Password works. Sign-in successful.', 'ok');
            setDetails(JSON.stringify(data, null, 2), 'ok');
        });
    </script>
</body>
</html>
