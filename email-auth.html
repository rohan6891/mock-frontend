<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabets Email Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #101a2f;
            --bg-2: #0f2f3f;
            --panel: rgba(10, 18, 34, 0.78);
            --ink: #eaf2ff;
            --muted: #9fb2cf;
            --stroke: rgba(185, 208, 245, 0.22);
            --ok: #67e1a8;
            --warn: #f1c16d;
            --danger: #ff8d8d;
            --teal: #2dcdb4;
            --blue: #3778f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Bricolage Grotesque", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1000px 450px at 80% -15%, rgba(87, 201, 255, 0.28), transparent 60%),
                radial-gradient(850px 420px at -20% 0%, rgba(45, 205, 180, 0.2), transparent 66%),
                linear-gradient(155deg, var(--bg), var(--bg-2));
            padding: 20px;
        }

        .top-nav {
            width: min(760px, 100%);
            margin: 0 auto 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .top-link {
            border: 1px solid var(--stroke);
            color: #d4e7ff;
            text-decoration: none;
            border-radius: 999px;
            padding: 7px 11px;
            font: 700 12px/1 "Space Mono", monospace;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(8, 15, 28, 0.5);
        }

        .shell {
            width: min(760px, 100%);
            margin: 0 auto;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(4, 10, 20, 0.35);
            backdrop-filter: blur(8px);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--stroke);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.35rem, 2.7vw, 1.9rem);
        }

        p { margin: 0; color: var(--muted); }

        .tabs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .tab {
            border: 1px solid rgba(180, 207, 245, 0.32);
            background: transparent;
            color: #d8ebff;
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
            font: 700 12px/1 "Space Mono", monospace;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--teal), var(--blue));
            border-color: transparent;
            color: #fff;
        }

        .section {
            padding: 18px 20px;
            border-bottom: 1px solid var(--stroke);
        }

        .section:last-child { border-bottom: 0; }

        label {
            display: block;
            margin: 10px 0 6px;
            color: #c5d7f1;
            font-size: 0.92rem;
        }

        input {
            width: 100%;
            border: 1px solid rgba(196, 219, 250, 0.24);
            border-radius: 10px;
            background: rgba(8, 14, 26, 0.76);
            color: var(--ink);
            padding: 11px 12px;
            font: 500 0.94rem/1 "Space Mono", monospace;
            outline: none;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            color: #eef6ff;
            font: 700 0.82rem/1 "Space Mono", monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-main { background: linear-gradient(135deg, var(--teal), var(--blue)); }
        .btn-alt { background: #2f4b78; }
        .btn-ghost { background: transparent; border: 1px solid rgba(180, 207, 245, 0.32); }

        .status {
            margin-top: 10px;
            min-height: 44px;
            border: 1px solid rgba(189, 211, 243, 0.2);
            border-radius: 10px;
            padding: 10px 11px;
            font: 0.84rem/1.45 "Space Mono", monospace;
            color: #d6e6fb;
            background: rgba(8, 14, 24, 0.72);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ok { border-color: rgba(103, 225, 168, 0.55); }
        .warn { border-color: rgba(241, 193, 109, 0.55); }
        .danger { border-color: rgba(255, 141, 141, 0.6); }
        .hidden { display: none; }

        details {
            border: 1px solid var(--stroke);
            border-radius: 10px;
            padding: 10px;
            background: rgba(7, 13, 26, 0.45);
        }

        summary {
            cursor: pointer;
            font: 700 0.83rem/1 "Space Mono", monospace;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a class="top-link" href="./index.html">Sign In</a>
        <a class="top-link" href="./email-auth.html">Sign Up</a>
        <a class="top-link" href="./password-reset.html">Forgot Password</a>
        <a class="top-link" href="./dashboard.html">Dashboard</a>
    </nav>

    <main class="shell">
        <section class="card">
            <div class="header">
                <h1>Email Authentication</h1>
                <p>Create account, verify email, then sign in. Social sign-in is available on the Sign In page.</p>
                <div class="tabs">
                    <button class="tab active" id="signupTab">Sign Up</button>
                    <button class="tab" id="signinTab">Sign In</button>
                </div>
            </div>

            <div class="section" id="signupPanel">
                <label for="signupUsername">Username</label>
                <input id="signupUsername" placeholder="new_user" />
                <label for="signupEmail">Email</label>
                <input id="signupEmail" placeholder="user@example.com" />
                <label for="signupPassword">Password</label>
                <input id="signupPassword" type="password" placeholder="StrongPassword@123" />
                <div class="row">
                    <button class="btn btn-main" id="signupBtn">Create Account</button>
                </div>

                <label for="verifyCode">Email Verification Code</label>
                <input id="verifyCode" maxlength="6" placeholder="6-digit code" />
                <div class="row">
                    <button class="btn btn-alt" id="verifyBtn">Verify Email</button>
                </div>
            </div>

            <div class="section hidden" id="signinPanel">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" placeholder="verified email" />
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" placeholder="password" />
                <div class="row">
                    <button class="btn btn-main" id="loginBtn">Sign In</button>
                    <button class="btn btn-ghost" id="toDashboardBtn">Continue</button>
                </div>

                <div id="login2faBox" class="hidden" style="margin-top: 12px;">
                    <label for="login2faCode">2FA Code</label>
                    <input id="login2faCode" maxlength="6" placeholder="6-digit code" />
                    <div class="row">
                        <button class="btn btn-alt" id="login2faBtn">Verify 2FA</button>
                    </div>
                </div>
            </div>

            <div class="section hidden" id="setupPanel">
                <p style="color: var(--muted);">2FA is optional right now. You can setup now or skip.</p>
                <div class="row">
                    <button class="btn btn-main" id="setup2faBtn">Setup 2FA</button>
                    <button class="btn btn-ghost" id="skip2faBtn">Skip for Now</button>
                </div>

                <div id="setupFlow" class="hidden" style="margin-top: 12px;">
                    <div id="setupInfo" class="status"></div>
                    <label for="setup2faCode">Authenticator Code</label>
                    <input id="setup2faCode" maxlength="6" placeholder="6-digit code" />
                    <div class="row">
                        <button class="btn btn-alt" id="verify2faBtn">Enable 2FA</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 style="margin: 0 0 8px; font-size: 1rem;">Status</h2>
                <div id="status" class="status">Ready.</div>
            </div>

            <div class="section">
                <details>
                    <summary>Advanced Settings</summary>
                    <label for="apiBase">API Base URL</label>
                    <input id="apiBase" value="https://anthropometrical-unrepined-elvie.ngrok-free.dev/api/v1" />
                </details>
            </div>
        </section>
    </main>

    <script>
        let authToken = null;
        let currentUser = null;
        let pending2faUserId = null;

        const statusEl = document.getElementById('status');
        const setupInfoEl = document.getElementById('setupInfo');
        const apiBaseEl = document.getElementById('apiBase');
        const signupPanel = document.getElementById('signupPanel');
        const signinPanel = document.getElementById('signinPanel');
        const setupPanel = document.getElementById('setupPanel');
        const login2faBox = document.getElementById('login2faBox');
        const setupFlow = document.getElementById('setupFlow');

        function apiBase() {
            return apiBaseEl.value.trim().replace(/\/$/, '');
        }

        function setStatus(msg, type) {
            statusEl.className = `status ${type || ''}`.trim();
            statusEl.textContent = msg;
        }

        function decodeJwt(token) {
            try {
                const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(atob(payload));
            } catch {
                return {};
            }
        }

        async function fetch2FAStatus(token) {
            const res = await fetch(`${apiBase()}/2fa/status`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (!res.ok) return { enabled: false };
            return res.json();
        }

        function saveSessionAndGoDashboard() {
            if (!authToken || !currentUser) {
                setStatus('No active session.', 'danger');
                return;
            }
            localStorage.setItem('krabets_session', JSON.stringify({
                token: authToken,
                user: {
                    provider: 'email',
                    id: currentUser.id,
                    username: currentUser.username,
                    email: currentUser.email || document.getElementById('loginEmail').value.trim() || null,
                    avatarUrl: null,
                    jwtPayload: decodeJwt(authToken),
                },
            }));
            window.location.href = './dashboard.html';
        }

        function showSignUp() {
            document.getElementById('signupTab').classList.add('active');
            document.getElementById('signinTab').classList.remove('active');
            signupPanel.classList.remove('hidden');
            signinPanel.classList.add('hidden');
        }

        function showSignIn() {
            document.getElementById('signinTab').classList.add('active');
            document.getElementById('signupTab').classList.remove('active');
            signinPanel.classList.remove('hidden');
            signupPanel.classList.add('hidden');
        }

        document.getElementById('signupTab').addEventListener('click', showSignUp);
        document.getElementById('signinTab').addEventListener('click', showSignIn);

        document.getElementById('signupBtn').addEventListener('click', async () => {
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            setStatus('Creating account...', 'warn');
            const res = await fetch(`${apiBase()}/auth/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`Signup failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            setStatus('Account created. Check email for verification code.', 'ok');
        });

        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const email = document.getElementById('signupEmail').value.trim();
            const code = document.getElementById('verifyCode').value.trim();

            setStatus('Verifying email...', 'warn');
            const res = await fetch(`${apiBase()}/auth/verify-email`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`Verify-email failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setStatus('Email verified. You can sign in now.', 'ok');
            showSignIn();
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            setStatus('Signing in...', 'warn');
            const res = await fetch(`${apiBase()}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`Login failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            if (data.requires2FA) {
                pending2faUserId = data.userId;
                login2faBox.classList.remove('hidden');
                setStatus('2FA required. Enter code to continue.', 'warn');
                return;
            }

            authToken = data.token;
            currentUser = data.user;
            pending2faUserId = null;
            login2faBox.classList.add('hidden');

            const tfa = await fetch2FAStatus(authToken);
            setupPanel.classList.remove('hidden');

            if (tfa.enabled) {
                setStatus('Sign in successful. 2FA already enabled. Continue to dashboard.', 'ok');
                return;
            }

            setStatus('Sign in successful. Setup 2FA now or skip.', 'ok');
        });

        document.getElementById('login2faBtn').addEventListener('click', async () => {
            const code = document.getElementById('login2faCode').value.trim();
            if (!pending2faUserId) {
                setStatus('No pending 2FA session.', 'danger');
                return;
            }

            setStatus('Verifying 2FA...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: pending2faUserId, code }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`2FA login failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            authToken = data.token;
            currentUser = data.user;
            pending2faUserId = null;
            login2faBox.classList.add('hidden');
            setupPanel.classList.remove('hidden');
            setStatus('2FA verified. Setup 2FA now or skip for later.', 'ok');
        });

        document.getElementById('setup2faBtn').addEventListener('click', async () => {
            if (!authToken) {
                setStatus('Sign in first.', 'danger');
                return;
            }

            setStatus('Creating 2FA setup...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/setup`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${authToken}` },
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`2FA setup failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setupFlow.classList.remove('hidden');
            setupInfoEl.textContent = `Secret: ${data.secret}\n\nQR (data url):\n${data.qrCodeUrl || '-'}`;
            setStatus('Scan with authenticator and enter code.', 'ok');
        });

        document.getElementById('verify2faBtn').addEventListener('click', async () => {
            const code = document.getElementById('setup2faCode').value.trim();
            if (!authToken || !code) {
                setStatus('Need active session and code.', 'danger');
                return;
            }

            setStatus('Enabling 2FA...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/verify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${authToken}`,
                },
                body: JSON.stringify({ code }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`2FA verify failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setStatus('2FA enabled. Continue to dashboard.', 'ok');
        });

        document.getElementById('skip2faBtn').addEventListener('click', saveSessionAndGoDashboard);
        document.getElementById('toDashboardBtn').addEventListener('click', saveSessionAndGoDashboard);
    </script>
</body>
</html>
