<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krabets Complete Email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1f33;
            --bg-2: #14355a;
            --panel: rgba(10, 24, 42, 0.8);
            --ink: #ecf6ff;
            --muted: #9bb6d5;
            --stroke: rgba(182, 210, 245, 0.22);
            --ok: #66e1aa;
            --warn: #f2bf66;
            --danger: #ff8d8d;
            --teal: #2cccb3;
            --blue: #3578f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            font-family: "Bricolage Grotesque", sans-serif;
            background:
                radial-gradient(1000px 500px at 85% -20%, rgba(86, 200, 255, 0.24), transparent 60%),
                radial-gradient(900px 420px at -18% 0%, rgba(44, 204, 179, 0.2), transparent 62%),
                linear-gradient(155deg, var(--bg), var(--bg-2));
            padding: 20px;
        }

        .top-nav {
            width: min(760px, 100%);
            margin: 0 auto 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .top-link {
            border: 1px solid var(--stroke);
            color: #d4e7ff;
            text-decoration: none;
            border-radius: 999px;
            padding: 7px 11px;
            font: 700 12px/1 "Space Mono", monospace;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: rgba(8, 15, 28, 0.5);
        }

        .shell { width: min(760px, 100%); margin: 0 auto; }

        .card {
            background: var(--panel);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(4, 10, 20, 0.35);
            backdrop-filter: blur(8px);
        }

        .section {
            padding: 18px 20px;
            border-bottom: 1px solid var(--stroke);
        }

        .section:last-child { border-bottom: 0; }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.35rem, 2.7vw, 1.9rem);
        }

        p { margin: 0; color: var(--muted); }

        label {
            display: block;
            margin: 10px 0 6px;
            color: #c6d8f2;
            font-size: 0.92rem;
        }

        input {
            width: 100%;
            border: 1px solid rgba(196, 219, 250, 0.24);
            border-radius: 10px;
            background: rgba(8, 14, 26, 0.78);
            color: var(--ink);
            padding: 11px 12px;
            font: 500 0.94rem/1 "Space Mono", monospace;
            outline: none;
        }

        .row {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            color: #eff7ff;
            font: 700 0.82rem/1 "Space Mono", monospace;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-main { background: linear-gradient(135deg, var(--teal), var(--blue)); }
        .btn-ghost { background: transparent; border: 1px solid rgba(180, 207, 245, 0.32); }

        .status {
            margin-top: 10px;
            min-height: 44px;
            border: 1px solid rgba(189, 211, 243, 0.2);
            border-radius: 10px;
            padding: 10px 11px;
            font: 0.84rem/1.45 "Space Mono", monospace;
            color: #d6e5fb;
            background: rgba(8, 14, 24, 0.72);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ok { border-color: rgba(102, 225, 170, 0.55); }
        .warn { border-color: rgba(242, 191, 102, 0.56); }
        .danger { border-color: rgba(255, 141, 141, 0.62); }

        .hidden { display: none; }

        details {
            border: 1px solid var(--stroke);
            border-radius: 10px;
            padding: 10px;
            background: rgba(7, 13, 26, 0.45);
        }

        summary {
            cursor: pointer;
            font: 700 0.83rem/1 "Space Mono", monospace;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a class="top-link" href="./index.html">Sign In</a>
        <a class="top-link" href="./email-auth.html">Sign Up</a>
        <a class="top-link" href="./password-reset.html">Forgot Password</a>
        <a class="top-link" href="./dashboard.html">Dashboard</a>
    </nav>

    <main class="shell">
        <section class="card">
            <div class="section">
                <h1>Complete Your Account</h1>
                <p>We need your email to finish account setup for this OAuth sign-in.</p>
            </div>

            <div class="section">
                <label for="email">Email</label>
                <input id="email" placeholder="you@example.com" />
                <div class="row">
                    <button class="btn btn-main" id="saveBtn">Save Email</button>
                    <button class="btn btn-ghost" id="dashboardBtn">Skip to Dashboard</button>
                </div>
            </div>

            <div class="section hidden" id="setupPanel">
                <p style="color: var(--muted);">2FA setup is optional now. Setup now or skip.</p>
                <div class="row">
                    <button class="btn btn-main" id="start2faBtn">Setup 2FA</button>
                    <button class="btn btn-ghost" id="skip2faBtn">Skip For Now</button>
                </div>

                <div id="setupBox" class="hidden" style="margin-top: 10px;">
                    <div id="setupDetails" class="status"></div>
                    <label for="setupCode">Authenticator Code</label>
                    <input id="setupCode" maxlength="6" placeholder="6-digit code" />
                    <div class="row">
                        <button class="btn btn-main" id="verify2faBtn">Enable 2FA</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 style="margin: 0 0 8px; font-size: 1rem;">Status</h2>
                <div id="status" class="status">Waiting for input...</div>
            </div>

            <div class="section">
                <details>
                    <summary>Advanced Settings</summary>
                    <label for="apiBase">API Base URL</label>
                    <input id="apiBase" value="https://anthropometrical-unrepined-elvie.ngrok-free.dev/api/v1" />
                </details>
            </div>
        </section>
    </main>

    <script>
        const statusEl = document.getElementById('status');
        const apiBaseEl = document.getElementById('apiBase');
        const setupPanelEl = document.getElementById('setupPanel');
        const setupBoxEl = document.getElementById('setupBox');
        const setupDetailsEl = document.getElementById('setupDetails');

        function apiBase() {
            return apiBaseEl.value.trim().replace(/\/$/, '');
        }

        function setStatus(msg, type) {
            statusEl.className = `status ${type || ''}`.trim();
            statusEl.textContent = msg;
        }

        function loadSession() {
            const raw = localStorage.getItem('krabets_session');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch { return null; }
        }

        async function updateSessionUser(partialUser) {
            const session = loadSession();
            if (!session) return;
            session.user = { ...(session.user || {}), ...(partialUser || {}) };
            localStorage.setItem('krabets_session', JSON.stringify(session));
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const session = loadSession();
            const email = document.getElementById('email').value.trim().toLowerCase();

            if (!session?.token) {
                setStatus('No logged-in OAuth session found. Sign in first.', 'danger');
                return;
            }
            if (!email) {
                setStatus('Email is required.', 'danger');
                return;
            }

            setStatus('Saving email...', 'warn');
            const res = await fetch(`${apiBase()}/auth/oauth/complete-email`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${session.token}`,
                },
                body: JSON.stringify({ email }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`Save email failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            await updateSessionUser(data.user || { email });
            setupPanelEl.classList.remove('hidden');
            setStatus('Email saved. Setup 2FA now or skip.', 'ok');
        });

        document.getElementById('start2faBtn').addEventListener('click', async () => {
            const session = loadSession();
            if (!session?.token) {
                setStatus('No active session found.', 'danger');
                return;
            }

            setStatus('Creating 2FA setup...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/setup`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${session.token}` },
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`2FA setup failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setupBoxEl.classList.remove('hidden');
            setupDetailsEl.textContent = `Secret: ${data.secret}\n\nQR (data url):\n${data.qrCodeUrl || '-'}`;
            setStatus('Enter authenticator code to enable 2FA.', 'ok');
        });

        document.getElementById('verify2faBtn').addEventListener('click', async () => {
            const session = loadSession();
            const code = document.getElementById('setupCode').value.trim();
            if (!session?.token) {
                setStatus('No active session found.', 'danger');
                return;
            }

            setStatus('Enabling 2FA...', 'warn');
            const res = await fetch(`${apiBase()}/2fa/verify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${session.token}`,
                },
                body: JSON.stringify({ code }),
            });
            const data = await res.json();

            if (!res.ok) {
                setStatus(`2FA verify failed:\n${JSON.stringify(data, null, 2)}`, 'danger');
                return;
            }

            setStatus('2FA enabled. Redirecting...', 'ok');
            setTimeout(() => { window.location.href = './dashboard.html'; }, 500);
        });

        document.getElementById('skip2faBtn').addEventListener('click', () => {
            window.location.href = './dashboard.html';
        });

        document.getElementById('dashboardBtn').addEventListener('click', () => {
            window.location.href = './dashboard.html';
        });
    </script>
</body>
</html>
